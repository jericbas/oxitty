name: Force Publish to Crates.io

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend assets
        run: |
          bun install
          bun run build:frontend

      - name: Verify crates.io secret
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set!"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN is configured."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish oxitty-protocol
        run: |
          echo "Packaging and publishing oxitty-protocol..."
          cargo publish -p oxitty-protocol --allow-dirty --token "$CARGO_REGISTRY_TOKEN" || echo "oxitty-protocol published or failed softly"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: |
          echo "Waiting 30s for crates.io index to update..."
          sleep 30

      - name: Publish oxitty-core
        run: |
          echo "Packaging and publishing oxitty-core..."
          cargo publish -p oxitty-core --allow-dirty --token "$CARGO_REGISTRY_TOKEN" || echo "oxitty-core published or failed softly"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: |
          echo "Waiting 30s for crates.io index to update..."
          sleep 30

      - name: Publish oxitty
        run: |
          echo "Packaging and publishing oxitty..."
          cargo publish -p oxitty --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
