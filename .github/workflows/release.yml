name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross compilation tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Determine release version
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v${VERSION}"
          fi
          VERSION=$(echo "${TAG}" | sed -E 's/.*v//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build frontend distribution
        run: |
          bun install
          bun run build:frontend

      - name: Build static release binary with cross
        run: cross build --release --target ${{ matrix.target }} -p oxitty-server

      - name: Assemble distribution tarball
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          TAR_DIR="oxitty-${VERSION}-${ARCH}"
          mkdir -p "${TAR_DIR}" dist
          cp "target/${{ matrix.target }}/release/oxitty" LICENSE-MIT LICENSE-APACHE README.md "${TAR_DIR}/"
          tar -czvf "dist/oxitty-${VERSION}-${ARCH}.tar.gz" "${TAR_DIR}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish Release Artifacts
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload Artifacts to GitHub Release
        run: |
          gh release upload "${{ steps.vars.outputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
