[workspace]
resolver = "2"
members = [
    "crates/oxitty-protocol",
    "crates/oxitty-core",
    "crates/oxitty",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Jeric Bas <jeric.codes@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jericbas/oxitty"
homepage = "https://github.com/jericbas/oxitty"
description = "High-performance Web TTY daemon built with Rust, React 19, Bun, Vite & tsrs"
readme = "README.md"

[workspace.dependencies]
oxitty-protocol = { version = "1.0.0", path = "crates/oxitty-protocol" }
oxitty-core = { version = "1.0.0", path = "crates/oxitty-core" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "10.1", features = ["serde-compat"] }
portable-pty = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
rust-embed = { version = "8.5", features = ["axum"] }
mime_guess = "2.0"
futures = "0.3"
thiserror = "2.0"
anyhow = "1.0"
toml = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
